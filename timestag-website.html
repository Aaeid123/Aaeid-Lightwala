<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Timestag — Data-Driven Digital Growth Agency | Ahmedabad</title>
<meta name="description" content="Timestag is a premium digital marketing agency in Ahmedabad specializing in SEO, PPC, Social Media, Web Design & Development. Grow your business with data-driven strategy."/>
<meta name="keywords" content="digital marketing agency ahmedabad, SEO, PPC, web design, social media marketing, timestag"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold-light:#E8C97A;--gold-pale:rgba(201,168,76,0.12);
  --navy:#0A0F1E;--navy-80:rgba(10,15,30,0.85);
  --white:#FFFFFF;--off:#FAFAF8;--cream:#F5F3EE;
  --gray:#6B7280;--light:#F1EFE9;--border:rgba(201,168,76,0.18);
  --green:#10B981;--red:#EF4444;
  --glass:rgba(255,255,255,0.72);--glass-dark:rgba(10,15,30,0.6);
  --r-sm:12px;--r-md:18px;--r-lg:28px;--r-xl:40px;
  --sh-gold:0 8px 40px rgba(201,168,76,0.18);
  --sh-lg:0 24px 64px rgba(10,15,30,0.12);
  --sh-xl:0 40px 100px rgba(10,15,30,0.16);
  --t:all 0.35s cubic-bezier(0.4,0,0.2,1);
}
html{scroll-behavior:smooth}
body{font-family:'Poppins',sans-serif;background:var(--off);color:var(--navy);overflow-x:hidden;cursor:none}
a{text-decoration:none;color:inherit}
img{max-width:100%;height:auto}
button{cursor:none;border:none;background:none;font-family:'Poppins',sans-serif}
input,textarea,select{font-family:'Poppins',sans-serif}
h1,h2,h3,h4,h5{line-height:1.15;letter-spacing:-0.03em}
h1{font-size:clamp(40px,5.5vw,76px);font-weight:800}
h2{font-size:clamp(28px,3.5vw,52px);font-weight:700}
h3{font-size:clamp(18px,2vw,26px);font-weight:700}
p{font-size:16px;line-height:1.75;color:var(--gray)}
.serif{font-family:'Playfair Display',serif}

/* CURSOR */
#cur{width:10px;height:10px;background:var(--gold);border-radius:50%;position:fixed;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s}
#cur-ring{width:38px;height:38px;border:1.5px solid var(--gold);border-radius:50%;position:fixed;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:transform .12s ease,width .3s,height .3s,opacity .3s;opacity:.5}
#cur.big{width:18px;height:18px;background:var(--gold-light)}
#cur-ring.big{width:60px;height:60px;opacity:.2}

/* SCROLL PROGRESS */
#spbar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-light),#E8C97A);z-index:10000;width:0%;transition:width .08s}

/* LOADER */
#loader{position:fixed;inset:0;background:var(--navy);z-index:99997;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .7s ease,visibility .7s}
#loader.out{opacity:0;visibility:hidden}
.loader-logo{font-size:42px;font-weight:800;color:white;letter-spacing:-2px}
.loader-logo em{color:var(--gold);font-style:normal}
.loader-track{width:220px;height:1.5px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.loader-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));animation:lbar 2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes lbar{from{width:0}to{width:100%}}

/* LAYOUT */
.container{max-width:1180px;margin:0 auto;padding:0 32px}
section{padding:110px 0}
.section-label{display:inline-flex;align-items:center;gap:8px;background:var(--gold-pale);border:1px solid var(--border);padding:6px 16px;border-radius:100px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:20px}
.section-label::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--gold)}
.section-head{text-align:center;margin-bottom:72px}
.section-head h2{margin-bottom:16px}
.section-head p{max-width:540px;margin:0 auto;font-size:17px}
.gold-text{background:linear-gradient(135deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 32px;border-radius:100px;font-weight:600;font-size:15px;transition:var(--t);position:relative;overflow:hidden;letter-spacing:-0.2px}
.btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.15);opacity:0;transition:opacity .3s}
.btn:hover::before{opacity:1}
.btn:hover{transform:translateY(-3px)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#B8941E);color:white;box-shadow:var(--sh-gold)}
.btn-gold:hover{box-shadow:0 16px 48px rgba(201,168,76,.4)}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--border)}
.btn-outline:hover{background:var(--cream);border-color:var(--gold)}
.btn-white{background:white;color:var(--navy);box-shadow:0 8px 32px rgba(0,0,0,.08)}
.btn-white:hover{box-shadow:0 16px 48px rgba(0,0,0,.14)}
.btn-dark{background:var(--navy);color:white}
.btn-dark:hover{box-shadow:0 16px 40px rgba(10,15,30,.35)}
.btn .arr{transition:transform .3s ease}
.btn:hover .arr{transform:translateX(5px)}
.btn-sm{padding:11px 22px;font-size:13px}

/* NAVBAR */
#navbar{position:fixed;top:0;left:0;right:0;z-index:9000;transition:var(--t)}
.nav-wrap{display:flex;align-items:center;justify-content:space-between;padding:22px 40px;transition:var(--t)}
#navbar.scrolled .nav-wrap{padding:14px 40px;background:rgba(250,250,248,.92);backdrop-filter:blur(28px);border-bottom:1px solid var(--border);box-shadow:var(--sh-lg)}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-1px;color:var(--navy)}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--gold),#B8941E);border-radius:9px;display:flex;align-items:center;justify-content:center;color:white;font-weight:900;font-size:14px}
.nav-logo em{color:var(--gold);font-style:normal}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{padding:9px 16px;font-size:14px;font-weight:500;color:var(--gray);border-radius:9px;transition:var(--t);position:relative}
.nav-link::after{content:'';position:absolute;bottom:4px;left:50%;right:50%;height:1.5px;background:var(--gold);border-radius:2px;transition:var(--t)}
.nav-link:hover,.nav-link.active{color:var(--navy)}
.nav-link:hover::after,.nav-link.active::after{left:16px;right:16px}
.nav-cta{display:flex;align-items:center;gap:10px}
.mob-menu{display:none;flex-direction:column;gap:5px;cursor:none;padding:8px}
.mob-menu span{display:block;width:22px;height:1.5px;background:var(--navy);border-radius:2px;transition:var(--t)}

/* HERO */
.hero{min-height:100vh;display:flex;align-items:center;position:relative;overflow:hidden;padding:130px 0 80px}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 65% 40%,rgba(201,168,76,.07) 0%,transparent 65%),radial-gradient(ellipse 50% 50% at 10% 80%,rgba(201,168,76,.04) 0%,transparent 60%),linear-gradient(180deg,var(--off) 0%,var(--cream) 100%)}
.hero-mesh{position:absolute;top:-200px;right:-200px;width:700px;height:700px;background:radial-gradient(circle,rgba(201,168,76,.08) 0%,transparent 70%);border-radius:50%;animation:meshPulse 8s ease-in-out infinite}
@keyframes meshPulse{0%,100%{transform:scale(1) rotate(0deg);opacity:.6}50%{transform:scale(1.15) rotate(10deg);opacity:1}}
.hero-inner{display:grid;grid-template-columns:1.1fr 0.9fr;gap:80px;align-items:center;position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;background:var(--glass);border:1px solid var(--border);border-radius:100px;font-size:13px;font-weight:500;color:var(--gray);backdrop-filter:blur(12px);margin-bottom:28px;box-shadow:0 4px 20px rgba(201,168,76,.1)}
.hero-badge .dot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.6)}}
.hero h1{margin-bottom:24px}
.hero h1 span{display:block}
.hero-sub{font-size:18px;line-height:1.7;color:var(--gray);margin-bottom:40px;max-width:500px}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:52px}
.hero-metrics{display:flex;gap:32px;padding-top:40px;border-top:1px solid var(--border)}
.h-metric-val{font-size:32px;font-weight:800;color:var(--navy);letter-spacing:-1.5px;line-height:1}
.h-metric-lbl{font-size:12px;color:var(--gray);font-weight:500;margin-top:4px}
.hero-visual{position:relative}
.hero-card-main{background:white;border-radius:var(--r-xl);box-shadow:var(--sh-xl);padding:36px;position:relative;z-index:2;border:1px solid var(--border);animation:cardFloat 6s ease-in-out infinite}
@keyframes cardFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-18px) rotate(1deg)}}
.hero-card-float{position:absolute;background:white;border-radius:var(--r-md);box-shadow:var(--sh-lg);border:1px solid var(--border);padding:16px 20px;backdrop-filter:blur(20px)}
.hcf-1{top:-20px;right:-30px;animation:cf1 7s ease-in-out infinite}
.hcf-2{bottom:20px;left:-40px;animation:cf2 8s ease-in-out infinite}
@keyframes cf1{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes cf2{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
.mini-chart{display:flex;align-items:flex-end;gap:4px;height:50px}
.mc-bar{width:10px;background:linear-gradient(180deg,var(--gold),rgba(201,168,76,.3));border-radius:3px;transition:height .3s}
.hero-stat-big{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-1px}
.hero-stat-lbl{font-size:11px;color:var(--gray);font-weight:500}
.hero-stat-up{font-size:12px;font-weight:600;color:var(--green)}

/* LOGO SLIDER */
.logo-slider{padding:48px 0;background:white;border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden}
.slider-label{text-align:center;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:32px;opacity:.6}
.logos-track{display:flex;gap:60px;animation:slide 25s linear infinite;white-space:nowrap}
.logos-track:hover{animation-play-state:paused}
.logo-item{font-weight:700;font-size:15px;color:var(--gray);opacity:.5;letter-spacing:-0.5px;transition:opacity .3s;flex-shrink:0}
.logo-item:hover{opacity:.9;color:var(--navy)}

/* SERVICES PAGE */
.services-bg{background:var(--cream)}
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.svc-card{background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:36px;transition:var(--t);position:relative;overflow:hidden;cursor:none}
.svc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-light));opacity:0;transition:opacity .3s}
.svc-card:hover{transform:translateY(-8px);box-shadow:var(--sh-xl);border-color:rgba(201,168,76,.3)}
.svc-card:hover::before{opacity:1}
.svc-icon-wrap{width:64px;height:64px;background:var(--gold-pale);border:1px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:24px;transition:var(--t)}
.svc-card:hover .svc-icon-wrap{transform:scale(1.1) rotate(-3deg);background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(201,168,76,.05))}
.svc-card h3{font-size:20px;margin-bottom:12px}
.svc-card p{font-size:14px;line-height:1.7;margin-bottom:20px}
.svc-link{font-size:13px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:6px;transition:gap .3s}
.svc-card:hover .svc-link{gap:12px}
.svc-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tag{padding:4px 12px;background:var(--cream);border-radius:100px;font-size:11px;font-weight:600;color:var(--gray)}

/* ABOUT */
.about-inner{display:grid;grid-template-columns:0.9fr 1.1fr;gap:80px;align-items:center}
.about-img{position:relative}
.about-img-main{width:100%;height:480px;border-radius:var(--r-xl);background:linear-gradient(135deg,var(--navy) 0%,#1a2744 40%,#0d1a3a 100%);box-shadow:var(--sh-xl),var(--sh-gold);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border)}
.about-img-main::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(201,168,76,.08),transparent);border-radius:var(--r-xl)}
.about-tag-float{position:absolute;background:white;border:1px solid var(--border);border-radius:var(--r-md);padding:14px 20px;box-shadow:var(--sh-lg)}
.atf-1{bottom:30px;right:-30px}
.atf-2{top:30px;left:-30px}
.about-val{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-1px}
.about-val-lbl{font-size:12px;color:var(--gray);font-weight:500}
.about-content .section-label{margin-bottom:20px}
.about-content h2{margin-bottom:24px}
.about-content p{margin-bottom:20px}
.about-features{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:32px 0}
.about-feat{display:flex;align-items:flex-start;gap:12px}
.feat-icon{width:36px;height:36px;min-width:36px;background:var(--gold-pale);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.feat-text h5{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:3px}
.feat-text p{font-size:13px}
.team-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:64px}
.team-card{text-align:center;background:white;border:1px solid var(--border);border-radius:var(--r-lg);padding:28px 20px;transition:var(--t)}
.team-card:hover{transform:translateY(-6px);box-shadow:var(--sh-xl)}
.team-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--navy));margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:white;box-shadow:var(--sh-gold)}
.team-name{font-weight:700;font-size:16px;color:var(--navy);margin-bottom:4px}
.team-role{font-size:12px;color:var(--gold);font-weight:600;text-transform:uppercase;letter-spacing:1px}

/* PORTFOLIO */
.portfolio-bg{background:var(--off)}
.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.port-card{border-radius:var(--r-lg);overflow:hidden;background:white;border:1px solid var(--border);transition:var(--t);cursor:none}
.port-card:hover{transform:translateY(-8px);box-shadow:var(--sh-xl)}
.port-visual{height:200px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.port-overlay{position:absolute;inset:0;background:var(--glass-dark);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s}
.port-card:hover .port-overlay{opacity:1}
.port-content{padding:24px}
.port-cat{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.port-content h3{font-size:18px;margin-bottom:8px;line-height:1.3}
.port-content p{font-size:13px;margin-bottom:16px}
.port-metrics{display:flex;gap:16px}
.pm-val{font-size:18px;font-weight:700;color:var(--navy);letter-spacing:-0.5px}
.pm-lbl{font-size:11px;color:var(--gray);font-weight:500}
.port-detail-bg{background:var(--off)}
.port-detail-hero{background:var(--navy);padding:120px 0 80px;text-align:center;color:white}
.port-detail-hero h1{color:white;margin-bottom:16px}
.port-detail-hero p{color:rgba(255,255,255,.6);font-size:18px;max-width:600px;margin:0 auto}
.results-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin:48px 0}
.result-card{background:white;border:1px solid var(--border);border-radius:var(--r-md);padding:28px;text-align:center}
.result-val{font-size:36px;font-weight:800;letter-spacing:-2px;margin-bottom:8px}
.back-btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--gold);margin-bottom:32px;cursor:none;transition:gap .3s}
.back-btn:hover{gap:14px}

/* BLOG */
.blog-bg{background:var(--cream)}
.blog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.blog-card{background:white;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:var(--t);cursor:none}
.blog-card:hover{transform:translateY(-6px);box-shadow:var(--sh-xl)}
.blog-visual{height:200px;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative}
.blog-cat-badge{position:absolute;top:16px;left:16px;background:white;border-radius:100px;padding:4px 12px;font-size:11px;font-weight:600;color:var(--gold);border:1px solid var(--border)}
.blog-content{padding:24px}
.blog-content h3{font-size:18px;margin-bottom:10px;line-height:1.4}
.blog-content p{font-size:13px;margin-bottom:16px}
.blog-meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--gray);font-weight:500}
.blog-detail-hero{background:linear-gradient(135deg,var(--navy),#1a2744);padding:140px 0 80px;text-align:center}
.blog-detail-hero h1{color:white;max-width:800px;margin:0 auto 20px}
.blog-detail-hero p{color:rgba(255,255,255,.6);font-size:17px}
.blog-body{max-width:760px;margin:0 auto;padding:80px 32px}
.blog-body h2{margin:40px 0 16px;font-size:28px}
.blog-body p{margin-bottom:20px;font-size:16px;line-height:1.85}
.blog-body ul{margin:0 0 20px 24px}
.blog-body ul li{margin-bottom:8px;font-size:15px;line-height:1.7;color:var(--gray)}

/* TESTIMONIALS */
.testi-bg{background:var(--navy);position:relative;overflow:hidden}
.testi-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 60% at 50% 50%,rgba(201,168,76,.05),transparent)}
.testi-bg .section-head h2{color:white}
.testi-bg .section-head p{color:rgba(255,255,255,.5)}
.testi-slider{overflow:hidden;position:relative}
.testi-track{display:flex;gap:24px;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.testi-card{min-width:500px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-xl);padding:44px;flex-shrink:0;transition:var(--t)}
.testi-card:hover{background:rgba(255,255,255,.07);border-color:rgba(201,168,76,.2)}
.testi-stars{color:var(--gold);font-size:18px;margin-bottom:20px;letter-spacing:2px}
.testi-quote{font-size:62px;font-family:'Playfair Display',serif;color:var(--gold);opacity:.2;line-height:.6;margin-bottom:16px}
.testi-card p{color:rgba(255,255,255,.7);font-size:16px;line-height:1.75;font-style:italic;margin-bottom:28px}
.testi-author{display:flex;align-items:center;gap:14px}
.testi-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#8B6914);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:white;flex-shrink:0}
.testi-name{font-weight:700;font-size:15px;color:white}
.testi-role{font-size:12px;color:rgba(255,255,255,.4)}
.slider-ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:44px}
.s-btn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:none;transition:var(--t)}
.s-btn:hover{background:var(--gold);border-color:var(--gold);color:white;transform:scale(1.1)}
.s-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);cursor:none;transition:var(--t)}
.s-dot.on{background:var(--gold);width:22px;border-radius:4px}

/* FAQ */
.faq-bg{background:white}
.faq-inner{max-width:780px;margin:0 auto}
.faq-item{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:14px;transition:var(--t)}
.faq-item.open{border-color:rgba(201,168,76,.4);box-shadow:var(--sh-gold)}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:24px 28px;cursor:none;background:white;transition:background .3s}

function useScrollFade() {
  useEffect(() => {
    const els = document.querySelectorAll('.fade-up');
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('in'); });
    }, { threshold: 0.1 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  });
}

  useScrollFade();
  const [form, setForm] = useState({name:'',email:'',phone:'',service:'',message:''});
  const [errors, setErrors] = useState({});

  const [loading, setLoading] = useState(false);

  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name = 'Name is required';
    if (!form.email.match(/^[^@]+@[^@]+\.[^@]+$/)) e.email = 'Valid email required';
    if (!form.phone.match(/^[0-9+\-\s]{8,15}$/)) e.phone = 'Valid phone required';
    if (!form.message.trim()) e.message = 'Message is required';
    return e;

    ev.preventDefault();
    const e = validate();
    if (Object.keys(e).length) { setErrors(e); return; }

                  <div className="check">✅</div>
                  <h3>Proposal Request Sent!</h3>

                </div>
              ) : (
                <form onSubmit={submit} noValidate>
                  <h3 style={{marginBottom:'8px'}}>Get Your Free Proposal</h3>
                  <p style={{marginBottom:'32px',fontSize:'14px'}}>No commitment required. We'll audit your digital presence and share exactly how we'd grow it.</p>
                  <div className="form-row">
                    <div className="form-group">
                      <label>Full Name *</label>
                      <input className={`form-input${errors.name?' err':''}`} placeholder="Arjun Sharma" value={form.name} onChange={e=>ch('name',e.target.value)}/>
                      {errors.name && <div className="err-msg">{errors.name}</div>}
                    </div>
                    <div className="form-group">
                      <label>Email Address *</label>
                      <input className={`form-input${errors.email?' err':''}`} type="email" placeholder="arjun@company.com" value={form.email} onChange={e=>ch('email',e.target.value)}/>
                      {errors.email && <div className="err-msg">{errors.email}</div>}
                    </div>
                  </div>
                  <div className="form-row">
                    <div className="form-group">
                      <label>Phone Number *</label>
                      <input className={`form-input${errors.phone?' err':''}`} placeholder="+91 98765 43210" value={form.phone} onChange={e=>ch('phone',e.target.value)}/>
                      {errors.phone && <div className="err-msg">{errors.phone}</div>}
                    </div>
                    <div className="form-group">
                      <label>Service Interested In</label>
                      <select className="form-input" value={form.service} onChange={e=>ch('service',e.target.value)}>
                        <option value="">Select a service...</option>
                        {['SEO','Social Media Marketing','PPC / Paid Media','Local SEO','Web Design','Web Development','Full Digital Strategy'].map(s=><option key={s}>{s}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="form-group">
                    <label>Tell Us About Your Goals *</label>
                    <textarea className={`form-input${errors.message?' err':''}`} placeholder="Describe your current challenges and what growth means for your business..." value={form.message} onChange={e=>ch('message',e.target.value)}/>
                    {errors.message && <div className="err-msg">{errors.message}</div>}
                  </div>
                  <button type="submit" className="btn btn-gold" style={{width:'100%',justifyContent:'center',fontSize:'16px',padding:'17px'}} disabled={loading}>
                    {loading ? '⏳ Sending...' : <><span>Send Proposal Request</span><span className="arr">→</span></>}
                  </button>
                  <p style={{fontSize:'12px',color:'var(--gray)',textAlign:'center',marginTop:'14px'}}>🔒 Your information is 100% secure and never shared with third parties.</p>
                </form>
              )}
            </div>
          </div>
        </div>
      </section>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────
function App() {
  const [page, setPage] = useState('Home');
  const [portfolioId, setPortfolioId] = useState(null);
  const [blogId, setBlogId] = useState(null);

  // Cursor
  useEffect(() => {
    const cur = document.getElementById('cur');
    const ring = document.getElementById('cur-ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; cur.style.left=mx+'px'; cur.style.top=my+'px'; });
    const raf = () => { rx+=(mx-rx)*.12; ry+=(my-ry)*.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(raf); };
    raf();
    document.querySelectorAll('a,button,.svc-card,.port-card,.blog-card,.testi-card,.faq-q,.back-btn,.nav-link,.f-soc,.s-btn,.s-dot,.btn,.mob-menu,.slider-ctrl,.team-card').forEach(el => {
      el.addEventListener('mouseenter', () => { cur.classList.add('big'); ring.classList.add('big'); });
      el.addEventListener('mouseleave', () => { cur.classList.remove('big'); ring.classList.remove('big'); });
    });
  }, [page]);

  // Scroll progress
  useEffect(() => {
    const bar = document.getElementById('spbar');
    const fn = () => {
      const s = window.scrollY;
      const d = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (s/d*100)+'%';
    };
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, [page]);

  // Loader
  useEffect(() => {
    setTimeout(() => document.getElementById('loader').classList.add('out'), 2200);
  }, []);

  const renderPage = () => {
    switch(page) {
      case 'Home': return <HomePage setPage={setPage}/>;
      case 'About': return <AboutPage/>;
      case 'Services': return <ServicesPage/>;
      case 'Portfolio': return <PortfolioPage setPage={setPage} setPortfolioId={setPortfolioId}/>;
      case 'PortfolioDetail': return <PortfolioDetailPage id={portfolioId} setPage={setPage}/>;
      case 'Blog': return <BlogPage setPage={setPage} setBlogId={setBlogId}/>;
      case 'BlogDetail': return <BlogDetailPage id={blogId} setPage={setPage}/>;
      case 'Testimonials': return <TestimonialsPage/>;
      case 'FAQ': return <FAQPage/>;
      case 'Contact': return <ContactPage/>;
      default: return <HomePage setPage={setPage}/>;
    }
  };

  return (
    <>
      <Navbar page={page} setPage={setPage}/>
      <main>{renderPage()}</main>
      <Footer setPage={setPage}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
