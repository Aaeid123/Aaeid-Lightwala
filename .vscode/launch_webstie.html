  d.head.appendChild(styleEl);

  /* ── BUILD DOM ── */
  const root = d.createElement('div');
  root.id = 'ag-root';

  root.innerHTML = `
    <!-- CHAT WINDOW -->
    <div id="ag-window" role="dialog" aria-modal="true" aria-label="${AGENT_CONFIG.agentName} AI Assistant">

      <!-- Header -->
      <div id="ag-header">
        <div class="ag-avatar">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="7" y="9" width="18" height="14" rx="5" fill="white" fill-opacity="0.92"/>
            <line x1="16" y1="4" x2="16" y2="9" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <circle cx="16" cy="3.5" r="2" fill="white"/>
            <circle cx="11.5" cy="14.5" r="2.5" fill="${AGENT_CONFIG.primaryColor}"/>
            <circle cx="12.2" cy="13.8" r="0.9" fill="white"/>
            <circle cx="20.5" cy="14.5" r="2.5" fill="${AGENT_CONFIG.primaryColor}"/>
            <circle cx="21.2" cy="13.8" r="0.9" fill="white"/>
            <path d="M12 19.5 Q16 22.5 20 19.5" stroke="${AGENT_CONFIG.primaryColor}" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <rect x="4" y="12" width="3" height="5" rx="1.5" fill="white" fill-opacity="0.65"/>
            <rect x="25" y="12" width="3" height="5" rx="1.5" fill="white" fill-opacity="0.65"/>
          </svg>
          <div class="ag-status-ring"></div>
        </div>
        <div class="ag-hd-info">
          <div class="ag-hd-name">
            ${AGENT_CONFIG.agentName}
            <span class="ag-hd-badge">${AGENT_CONFIG.agentTitle}</span>
          </div>
          <div class="ag-hd-sub">
            <span class="ag-hd-dot"></span>
            ${AGENT_CONFIG.companyName} · Online Now
          </div>
        </div>
        <div class="ag-hd-actions">
          <button class="ag-hd-btn" id="ag-reset-btn" title="Reset chat" aria-label="Reset chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
          <button class="ag-hd-btn" id="ag-close-btn" title="Close" aria-label="Close chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Messages -->
      <div id="ag-messages" role="log" aria-live="polite"></div>

      <!-- Typing -->
      <div id="ag-typing" class="hidden" role="status" aria-label="Agent is typing">
        <div class="ag-ava bot">
          <svg viewBox="0 0 32 32" fill="none" width="14" height="14">
            <rect x="7" y="9" width="18" height="14" rx="5" fill="white" fill-opacity="0.9"/>
            <circle cx="11.5" cy="14.5" r="2.5" fill="${AGENT_CONFIG.primaryColor}"/>
            <circle cx="20.5" cy="14.5" r="2.5" fill="${AGENT_CONFIG.primaryColor}"/>
          </svg>
        </div>
        <div class="ag-typing-bubble">
          <div class="ag-dot"></div>
          <div class="ag-dot"></div>
          <div class="ag-dot"></div>
        </div>
      </div>

      <!-- Suggestions -->
      <div id="ag-suggestions"></div>

      <!-- Input -->
      <div id="ag-input-bar">
        <div class="ag-input-wrap" id="ag-input-wrap">
          <textarea
            id="ag-textarea"
            placeholder="${AGENT_CONFIG.placeholder}"
            rows="1"
            aria-label="Message input"
          ></textarea>
        </div>
        <button id="ag-send" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>

      <!-- Branding -->
      <div id="ag-branding">
        <span>✦</span>
        <a href="#" tabindex="-1">${AGENT_CONFIG.brandingText}</a>
      </div>
    </div>

    <!-- Launcher -->
    <button id="ag-launcher" aria-label="Open AI assistant" aria-expanded="false">
      <span id="ag-badge">1</span>
      <span class="ag-ico-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </span>
      <span class="ag-ico-close">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </span>
    </button>

    <!-- Toast -->
    <div id="ag-toast" role="alert"></div>
  `;

  d.body.appendChild(root);

  /* ── STATE ── */
  const S = {
    open: false,
    ready: false,
    leadStep: null,
    leadData: {},
    history: [],    // Anthropic format
    msgCount: 0,
  };

  /* ── ELEMENT REFS ── */
  const $ = (id) => d.getElementById(id);
  const el = {
    window: $('ag-window'),
    launcher: $('ag-launcher'),
    badge: $('ag-badge'),
    messages: $('ag-messages'),
    textarea: $('ag-textarea'),
    send: $('ag-send'),
    typing: $('ag-typing'),
    suggestions: $('ag-suggestions'),
    reset: $('ag-reset-btn'),
    close: $('ag-close-btn'),
    toast: $('ag-toast'),
  };

  /* ── OPEN / CLOSE ── */
  function toggle() {
    S.open = !S.open;
    el.window.classList.toggle('ag-open', S.open);
    el.launcher.classList.toggle('ag-open', S.open);
    el.launcher.setAttribute('aria-expanded', String(S.open));
    el.badge.style.display = 'none';

    if (S.open && !S.ready) {
      S.ready = true;
      setTimeout(init, 380);
    }
    if (S.open) setTimeout(() => el.textarea.focus(), 400);
  }

  function init() {
    setTyping(true);
    setTimeout(() => {
      setTyping(false);
      addBot(AGENT_CONFIG.greeting);
      renderChips(AGENT_CONFIG.suggestions);
    }, 950);
  }

  /* ── SEND ── */
  async function send() {
    const txt = el.textarea.value.trim();
    if (!txt) return;

    addUser(txt);
    el.textarea.value = '';
    resize();
    clearChips();

    if (S.leadStep) { handleLead(txt); return; }

    S.history.push({ role: 'user', content: txt });
    el.send.disabled = true;
    setTyping(true);

    try {
      const reply = await callAI(S.history);
      S.history.push({ role: 'assistant', content: reply });
      setTyping(false);
      addBot(reply);

      // Detect lead trigger
      if (/your name|share your name|get your name|could i get/i.test(reply)) {
        S.leadStep = 'name';
      }

      renderContextChips(reply);
    } catch {
      setTyping(false);
      addBot(fallback(txt));
      renderChips(AGENT_CONFIG.suggestions);
    }

    el.send.disabled = false;
    S.msgCount++;
  }

  /* ── AI CALL (Anthropic — no key needed) ── */
  async function callAI(messages) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 450,
        system: AGENT_CONFIG.systemPrompt,
        messages,
      }),
    });
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    return data.content?.[0]?.text || '';
  }

  /* ── FALLBACK ── */
  function fallback(txt) {
    const m = txt.toLowerCase();
    if (/hi|hello|hey/.test(m)) return `Hello! 👋 Welcome to **${AGENT_CONFIG.companyName}**.\n\nI'm ${AGENT_CONFIG.agentName}, your AI assistant. How can I help you today?`;
    if (/ai|machine learning|chatbot/.test(m)) return `Reasonify builds **AI & ML solutions** — intelligent chatbots, predictive analytics, and automation tools.\n\nWhat problem are you looking to solve with AI?`;
    if (/price|cost|quote/.test(m)) return `Pricing depends on project scope. Let me set up a **free consultation** to give you an accurate estimate.\n\nCould you share your name to get started?`;
    if (/web|app|mobile/.test(m)) return `We build **web & mobile applications** from MVPs to enterprise platforms.\n\nWhat type of product are you envisioning?`;
    if (/automat|workflow/.test(m)) return `Reasonify's **automation solutions** cut manual work by up to 80%.\n\nWhat processes would you like to automate?`;
    return `Great question! Let me connect you with our team for a detailed answer.\n\nCould you share your **name and email** to get started?`;
  }

  /* ── LEAD FLOW ── */
  function handleLead(txt) {
    const step = S.leadStep;

    if (step === 'name') {
      S.leadData.name = txt; S.leadStep = 'email';
      setTimeout(() => addBot(`Nice to meet you, **${txt}**! 😊\n\nWhat's your **email address**?`), 500);

    } else if (step === 'email') {
      if (!txt.includes('@')) { addBot("That doesn't look right — could you double-check your **email**?"); return; }
      S.leadData.email = txt; S.leadStep = 'phone';
      setTimeout(() => addBot("Got it! And your **phone number**?"), 500);

    } else if (step === 'phone') {
      S.leadData.phone = txt; S.leadStep = 'company';
      setTimeout(() => addBot("Perfect. What's your **company name**?"), 500);

    } else if (step === 'company') {
      S.leadData.company = txt; S.leadStep = 'project';
      setTimeout(() => addBot("Almost done! Briefly describe your **project or requirement**."), 500);

    } else if (step === 'project') {
      S.leadData.project = txt; S.leadStep = null;
      const { name, email, phone, company, project } = S.leadData;

      // Save lead
      try {
        const leads = JSON.parse(localStorage.getItem('ag_leads') || '[]');
        leads.push({ ...S.leadData, ts: new Date().toISOString() });
        localStorage.setItem('ag_leads', JSON.stringify(leads));
      } catch {}

      // Dispatch event for external integrations
      w.dispatchEvent(new CustomEvent('ag:lead', { detail: S.leadData }));

      setTimeout(() => {
        addBot(`✅ **Thank you, ${name}!**\n\nWe've got your details:\n• **Company:** ${company}\n• **Email:** ${email}\n• **Phone:** ${phone}\n\nOur team will reach out within **24 hours**. Is there anything else I can help with?`);
        toast('✅ Details submitted!', '#22c55e');
        S.leadData = {};
        renderChips(AGENT_CONFIG.suggestions);
      }, 600);
    }
  }

  /* ── RENDER MESSAGES ── */
  function botSvg() {
    return `<div class="ag-ava bot"><svg viewBox="0 0 32 32" fill="none" width="14" height="14"><rect x="7" y="9" width="18" height="14" rx="5" fill="white" fill-opacity="0.9"/><circle cx="11.5" cy="14.5" r="2.5" fill="${AGENT_CONFIG.primaryColor}"/><circle cx="12.2" cy="13.8" r="0.9" fill="white"/><circle cx="20.5" cy="14.5" r="2.5" fill="${AGENT_CONFIG.primaryColor}"/><circle cx="21.2" cy="13.8" r="0.9" fill="white"/></svg></div>`;
  }

  function addBot(md) {
    const g = d.createElement('div');
    g.className = 'ag-msg-group bot';
    g.innerHTML = `<div class="ag-msg-row">${botSvg()}<div class="ag-bubble bot">${parseMd(md)}</div></div><div class="ag-meta">${AGENT_CONFIG.agentName} · ${ts()}</div>`;
    el.messages.appendChild(g);
    scrollDown();
  }

  function addUser(txt) {
    const g = d.createElement('div');
    g.className = 'ag-msg-group user';
    g.innerHTML = `<div class="ag-msg-row"><div class="ag-bubble user">${esc(txt)}</div><div class="ag-ava user">You</div></div><div class="ag-meta">${ts()}</div>`;
    el.messages.appendChild(g);
    scrollDown();
  }

  /* ── CHIPS ── */
  function renderChips(items) {
    el.suggestions.innerHTML = items.map(({ emoji, text }) =>
      `<button class="ag-chip" onclick="window.__agChip(this)">${emoji} ${text}</button>`
    ).join('');
  }

  function renderContextChips(reply) {
    const r = reply.toLowerCase();
    if (/consultation|reach out|connect you/i.test(r)) {
      renderChips([
        { emoji: '📞', text: 'Book a Call' },
        { emoji: '📧', text: 'Send Details' },
        { emoji: '❓', text: 'More Info' },
      ]);
    } else {
      renderChips(AGENT_CONFIG.suggestions);
    }
  }

  function clearChips() { el.suggestions.innerHTML = ''; }

  w.__agChip = function(btn) {
    const txt = btn.textContent.replace(/^\S+\s/, '').trim();
    el.textarea.value = txt;
    clearChips();
    send();
  };

  /* ── MARKDOWN PARSER ── */
  function parseMd(t) {
    return t
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.*?)\*/g,'<em>$1</em>')
      .replace(/^[-•]\s(.+)$/gm,'<li>$1</li>')
      .replace(/(<li>.*?<\/li>(\s*<li>.*?<\/li>)*)/gs,'<ul style="padding-left:15px;margin:5px 0">$1</ul>')
      .replace(/\n\n/g,'<br><br>')
      .replace(/\n/g,'<br>');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── UTILITIES ── */
  function setTyping(show) {
    el.typing.classList.toggle('hidden', !show);
    if (show) el.messages.scrollTop = el.messages.scrollHeight;
  }

  function scrollDown() {
    el.messages.scrollTo({ top: el.messages.scrollHeight, behavior: 'smooth' });
  }

  function ts() {
    return new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
  }

  function toast(msg, color) {
    el.toast.innerHTML = `<span style="color:${color}">●</span> ${esc(msg)}`;
    el.toast.classList.add('show');
    setTimeout(() => el.toast.classList.remove('show'), 3200);
  }

  function resize() {
    const t = el.textarea;
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 100) + 'px';
  }

  /* ── EVENT LISTENERS ── */
  el.launcher.addEventListener('click', toggle);
  el.close.addEventListener('click', () => { if (S.open) toggle(); });
  el.send.addEventListener('click', send);

  el.textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  el.textarea.addEventListener('input', resize);

  el.reset.addEventListener('click', () => {
    S.history = []; S.leadStep = null; S.leadData = {}; S.ready = false; S.msgCount = 0;
    el.messages.innerHTML = '';
    clearChips();
    setTimeout(init, 150);
    toast('Chat reset', '#4f6eff');
  });

  d.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && S.open) toggle();
  });

  /* ── AUTO BADGE ── */
  setTimeout(() => {
    if (!S.open) el.badge.style.display = 'flex';
  }, 3000);

  /* ── PUBLIC API ── */
  w.TimestagAgent = {
    open: () => { if (!S.open) toggle(); },
    close: () => { if (S.open) toggle(); },
    send: (msg) => { el.textarea.value = msg; send(); },
    getLeads: () => JSON.parse(localStorage.getItem('ag_leads') || '[]'),
    config: AGENT_CONFIG,
    version: '2.0.0',
  };

  console.info('%c🤖 Timestag AI Agent loaded', 'color:#4f6eff;font-weight:700');
  console.info('%cAPI: window.TimestagAgent.open() | .close() | .getLeads()', 'color:#888;font-size:11px');

})(window, document);
</script>

</body>
</html>
